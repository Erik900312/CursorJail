name: Build CursorJail
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build CursorJail.slnx --configuration Release
      - name: Verify safety and geometry
        run: dotnet run --project tests/CursorJail.Specs --configuration Release --no-build
      - name: Publish portable Windows app
        run: dotnet publish src/CursorJail --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output dist/CursorJail-win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: CursorJail-win-x64
          path: dist/CursorJail-win-x64/
